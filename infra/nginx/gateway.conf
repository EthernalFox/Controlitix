upstream ms_editor_upstream {
    server ms-editor:8080;
}

upstream editor_ui_upstream {
    server editor-ui:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ms-editor REST API. Strip the /api prefix before forwarding.
    location /api/ {
        proxy_pass http://ms_editor_upstream/;
        proxy_read_timeout 60s;
    }

    # Editor UI (SPA).
    location / {
        proxy_pass http://editor_ui_upstream;
    }
}
