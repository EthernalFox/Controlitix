services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ms_editor_postgres:/var/lib/postgresql/data

  ms-editor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MS_EDITOR_AUTH_JWKS_URL: ${MS_EDITOR_AUTH_JWKS_URL:-http://ms-auth:8083/.well-known/jwks.json}
      MS_EDITOR_AUTH_ISSUER: ${MS_EDITOR_AUTH_ISSUER:-controlitix-auth}
      MS_EDITOR_AUTH_AUDIENCE: ${MS_EDITOR_AUTH_AUDIENCE:-controlitix-api}
      MS_EDITOR_AUTH_DISABLED: ${MS_EDITOR_AUTH_DISABLED:-false}
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  ms_editor_postgres:
