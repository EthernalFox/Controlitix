services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-controlitix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlitix}
      POSTGRES_DB: ${POSTGRES_DB:-controlitix}
    expose:
      - "5432"
    volumes:
      - ms_auth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-auth-migrate:
    build: .
    restart: "no"
    env_file: .env
    entrypoint: ["/app/ms-auth-migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  ms-auth:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      ms-auth-migrate:
        condition: service_completed_successfully
    ports:
      - "8083:8083"

volumes:
  ms_auth_postgres:
