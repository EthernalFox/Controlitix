name: controlitix

services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: controlitix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - controlitix

  kafka:
    image: bitnami/kafka:3.7
    container_name: controlitix-kafka
    restart: unless-stopped
    environment:
      # KRaft (no Zookeeper)
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9094}"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_KRAFT_CLUSTER_ID}"
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - controlitix

  # ============================================================
  # ms-editor (Go) — objects, devices, tags, diagrams
  # ============================================================

  ms-editor-migrate:
    build:
      context: ./ms-editor
      dockerfile: Dockerfile
    image: controlitix/ms-editor:latest
    container_name: controlitix-ms-editor-migrate
    restart: "no"
    entrypoint: ["/app/goose"]
    command:
      [
        "-dir", "/app/migrations",
        "postgres", "${MS_EDITOR_DATABASE_URL}",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - controlitix

  ms-editor:
    build:
      context: ./ms-editor
      dockerfile: Dockerfile
    image: controlitix/ms-editor:latest
    container_name: controlitix-ms-editor
    restart: unless-stopped
    environment:
      MS_EDITOR_HTTP_ADDRESS: ":8080"
      MS_EDITOR_LOG_LEVEL: ${MS_EDITOR_LOG_LEVEL:-info}
      MS_EDITOR_DATABASE_URL: ${MS_EDITOR_DATABASE_URL}
      MS_EDITOR_KAFKA_BROKERS: ${MS_EDITOR_KAFKA_BROKERS:-kafka:9092}
      MS_EDITOR_KAFKA_TOPIC: ${MS_EDITOR_KAFKA_TOPIC:-config.changed}
    depends_on:
      ms-editor-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - controlitix

  # ============================================================
  # editor-ui (React/Vite) — engineering UI, served by nginx
  # ============================================================

  editor-ui:
    build:
      context: ./editor-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${EDITOR_UI_API_URL:-/api}
    image: controlitix/editor-ui:latest
    container_name: controlitix-editor-ui
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - controlitix

  # ============================================================
  # Gateway (Nginx) — single entry point
  # ============================================================

  gateway:
    image: nginx:1.27-alpine
    container_name: controlitix-gateway
    restart: unless-stopped
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    depends_on:
      - ms-editor
      - editor-ui
    networks:
      - controlitix

volumes:
  postgres_data:
  kafka_data:

networks:
  controlitix:
    driver: bridge
