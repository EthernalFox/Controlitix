services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ms_editor_postgres:/var/lib/postgresql/data

  ms-editor:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  ms_editor_postgres:
