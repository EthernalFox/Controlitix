upstream ms_editor_upstream {
    server ms-editor:8080;
}

upstream ms_auth_upstream {
    server ms-auth:8083;
}

upstream ms_viewer_upstream {
    server ms-viewer:8084;
}

upstream editor_ui_upstream {
    server editor-ui:80;
}

upstream viewer_ui_upstream {
    server viewer-ui:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ms-auth REST API
    location /api/auth/ {
        proxy_pass http://ms_auth_upstream/;
        proxy_read_timeout 30s;
    }

    # ms-viewer WebSocket (must be before /api/viewer/ to match first)
    location /api/viewer/ws {
        proxy_pass http://ms_viewer_upstream/ws;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ms-viewer REST API
    location /api/viewer/ {
        proxy_pass http://ms_viewer_upstream/;
        proxy_read_timeout 60s;
    }

    # ms-editor REST API (strip /api prefix)
    location /api/ {
        proxy_pass http://ms_editor_upstream/;
        proxy_read_timeout 60s;
    }

    # Viewer UI SPA
    location /viewer/ {
        proxy_pass http://viewer_ui_upstream/;
    }

    # Editor UI SPA (catch-all)
    location / {
        proxy_pass http://editor_ui_upstream;
    }
}
